name: 🚀 Deploy  to VPS via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🔐 SSH & Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: 🔍 Verify deploy secrets & SSH reachability
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_HOST secret is not set in GitHub repo settings."
            exit 1
          fi
          if [ -z "${VPS_USER:-}" ]; then
            echo "::error::VPS_USER secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.VPS_PASSWORD }}" ]; then
            echo "::error::VPS_PASSWORD secret is not set."
            exit 1
          fi

          host="$(printf '%s' "$VPS_HOST" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##' | xargs)"
          port="$(printf '%s' "${VPS_PORT:-22}" | xargs)"
          port="${port:-22}"

          if [ "$host" != "$VPS_HOST" ]; then
            echo "::warning::VPS_HOST should be a bare IP or hostname (got: $VPS_HOST). Using: $host"
          fi

          # App/API ports are not SSH — GitHub Actions must reach the SSH daemon.
          if [ "$port" = "42843" ] || [ "$port" = "42844" ] || [ "$port" = "5173" ] || [ "$port" = "5175" ] || [ "$port" = "80" ] || [ "$port" = "443" ]; then
            echo "::error::VPS_PORT looks like an app/HTTP port ($port), not SSH. Set VPS_PORT to your SSH port (usually 22)."
            exit 1
          fi

          echo "Testing TCP to ${host}:${port} (SSH) ..."
          ok=""
          for attempt in 1 2 3; do
            if nc -zv -w 20 "$host" "$port"; then
              ok="yes"
              echo "SSH port reachable (attempt ${attempt})."
              break
            fi
            echo "Attempt ${attempt} failed; retrying in 5s ..."
            sleep 5
          done

          if [ -z "$ok" ]; then
            echo "::error::Cannot reach ${host}:${port} from GitHub Actions."
            echo "Check: (1) VPS is running, (2) VPS_PORT is SSH port (usually 22),"
            echo "(3) cloud firewall / UFW allows inbound SSH from the internet,"
            echo "(4) VPS_HOST is the public IP or DNS name."
            exit 1
          fi

      - name: 📦 Install rsync/sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass netcat-openbsd

      - name: 📤 Upload files to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          host="$(printf '%s' "$VPS_HOST" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##' | xargs)"
          port="$(printf '%s' "${VPS_PORT:-22}" | xargs)"
          port="${port:-22}"

          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude ".env" \
            --exclude "logs/" \
            --exclude "uploads/" \
            --exclude "public/uploads/" \
            -e "sshpass -e ssh -p ${port} \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3" \
            ./ "${VPS_USER}@${host}:/var/www/html/flowbooks/"

      - name: 🔐 SSH to VPS and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            cd /var/www/html/flowbooks/
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # nvm refuses to switch when ~/.npmrc has prefix/globalconfig.
            # Strip those keys (keep a backup) so deploy can use the nvm Node.
            if [ -f "$HOME/.npmrc" ]; then
              cp "$HOME/.npmrc" "$HOME/.npmrc.bak-flowbooks-deploy" 2>/dev/null || true
              grep -vE '^(prefix|globalconfig)[[:space:]]*=' "$HOME/.npmrc" > "$HOME/.npmrc.tmp" \
                && mv "$HOME/.npmrc.tmp" "$HOME/.npmrc" \
                || rm -f "$HOME/.npmrc.tmp"
            fi
            # Also clear runtime npm config that can reintroduce the conflict.
            npm config delete prefix >/dev/null 2>&1 || true
            npm config delete globalconfig >/dev/null 2>&1 || true
            unset npm_config_prefix npm_config_globalconfig NPM_CONFIG_PREFIX NPM_CONFIG_GLOBALCONFIG || true

            nvm install 22 >/dev/null 2>&1 || true
            NODE_VER="$(nvm version 22 2>/dev/null || true)"
            if [ -z "$NODE_VER" ] || [ "$NODE_VER" = "N/A" ]; then
              NODE_VER="$(ls -1d "$NVM_DIR"/versions/node/v22.* 2>/dev/null | sed 's|.*/||' | sort -V | tail -1 || true)"
            fi
            if [ -n "$NODE_VER" ] && [ "$NODE_VER" != "N/A" ]; then
              nvm use --delete-prefix "$NODE_VER" --silent || nvm use "$NODE_VER"
            else
              nvm use 22
            fi

            # Hard fallback: put nvm's node bin first on PATH
            if ! command -v node >/dev/null 2>&1; then
              NODE_BIN="$(ls -1d "$NVM_DIR"/versions/node/v22.*/bin 2>/dev/null | sort -V | tail -1)"
              [ -n "$NODE_BIN" ] && export PATH="$NODE_BIN:$PATH"
            fi

            node -v
            npm -v

            npm install --legacy-peer-deps
            npm run migrate
            npm run build
            pm2 restart flowbooks || pm2 start build/app.js --name=flowbooks
            pm2 save

            echo "✅ App deploy finished (install / migrate / build / pm2)."

            # Apache proxy is optional — sudo often needs a password on this VPS,
            # and must not fail the deploy after a successful pm2 restart.
            APP_PORT="$(grep -E '^PORT=' .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
            APP_PORT="${APP_PORT:-42843}"
            CONF_DIR="/etc/apache2/conf-available"
            CONF_FILE="${CONF_DIR}/flowbooks-proxy.conf"

            configure_apache_proxy() {
              if [ ! -d "$CONF_DIR" ]; then
                echo "::warning::Apache conf-available not found; skip /flowbooks proxy."
                return 0
              fi
              if ! command -v sudo >/dev/null 2>&1; then
                echo "::warning::sudo not available; skip /flowbooks proxy."
                return 0
              fi
              # Non-interactive only — never prompt for a password in CI.
              if ! sudo -n true 2>/dev/null; then
                echo "::warning::Passwordless sudo not available; skip Apache /flowbooks proxy."
                echo "On the VPS, either grant passwordless sudo for apache2, or create ${CONF_FILE} once manually."
                return 0
              fi
              printf '%s\n' \
                '# Managed by aa_erp_api GitHub Actions deploy' \
                'ProxyPreserveHost On' \
                'RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"' \
                "ProxyPass /flowbooks http://127.0.0.1:${APP_PORT}/flowbooks" \
                "ProxyPassReverse /flowbooks http://127.0.0.1:${APP_PORT}/flowbooks" \
                "ProxyPass /flowbooks/ http://127.0.0.1:${APP_PORT}/flowbooks/" \
                "ProxyPassReverse /flowbooks/ http://127.0.0.1:${APP_PORT}/flowbooks/" \
                | sudo -n tee "$CONF_FILE" >/dev/null
              sudo -n a2enmod proxy proxy_http headers >/dev/null 2>&1 || true
              sudo -n a2enconf flowbooks-proxy >/dev/null 2>&1 || true
              if sudo -n apache2ctl configtest && sudo -n systemctl reload apache2; then
                echo "Apache /flowbooks proxy enabled → 127.0.0.1:${APP_PORT}"
              else
                echo "::warning::Apache configtest/reload failed; app is still running via pm2."
              fi
            }

            configure_apache_proxy
