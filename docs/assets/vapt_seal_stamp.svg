<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c41e3a"/>
      <stop offset="100%" style="stop-color:#8b0000"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#c41e3a" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#c41e3a" stroke-width="2"/>
  <!-- Top arc text -->
  <path id="topArc" d="M 40 100 A 60 60 0 0 1 160 100" fill="none"/>
  <text fill="#c41e3a" font-family="Georgia, serif" font-size="11" font-weight="bold" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">BRAINSTORM IT SOLUTIONS</textPath>
  </text>
  <!-- Bottom arc text -->
  <path id="botArc" d="M 160 100 A 60 60 0 0 1 40 100" fill="none"/>
  <text fill="#c41e3a" font-family="Georgia, serif" font-size="9" text-anchor="middle">
    <textPath href="#botArc" startOffset="50%">" AUTHORISED "</textPath>
  </text>
  <!-- Center text -->
  <text x="100" y="97" fill="#c41e3a" font-family="Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle">VAPT</text>
  <text x="100" y="112" fill="#c41e3a" font-family="Georgia, serif" font-size="10" text-anchor="middle">REPORT</text>
</svg>
